<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGH22 · Panel</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#283040;--txt:#e6edf3;--dim:#8b949e;--acc:#2f81f7;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}
main{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
input,select,textarea{width:100%;padding:8px;background:#0d1117;border:1px solid var(--line);border-radius:6px;color:var(--txt);font:inherit}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.danger{background:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
code{font-family:ui-monospace,monospace;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px}
.pill.unused{background:#1f6feb33;color:#79c0ff}
.pill.used{background:#3fb95033;color:var(--ok)}
.pill.revoked{background:#f8514933;color:var(--bad)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--dim);cursor:pointer}
.drop.hover{border-color:var(--acc);color:var(--acc)}
.hidden{display:none}
#log,#upLog{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;color:var(--dim);max-height:180px;overflow:auto}
#genOut{font-family:ui-monospace,monospace;font-size:13px;color:var(--ok)}
</style>
</head>
<body>

<header>
  <h1>TGH22 · Panel de códigos</h1>
  <div id="authBox"></div>
</header>

<main>
  <section id="loginView" class="card">
    <h2>Acceso</h2>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Contraseña</label><input id="pass" type="password" autocomplete="current-password">
    <div style="margin-top:12px"><button id="btnLogin">Entrar</button></div>
    <div id="log" style="margin-top:12px"></div>
  </section>

  <div id="appView" class="hidden">

    <section class="card">
      <h2>Generar códigos</h2>
      <div class="row">
        <div><label>ID de dispositivo (opcional)</label><input id="genDev" placeholder="vacío = se liga al primer uso"></div>
        <div><label>Etiqueta</label><input id="genLabel" placeholder="Cliente / modelo"></div>
        <div><label>Cantidad</label><input id="genQty" type="number" value="1" min="1" max="200"></div>
        <div><label>Usos máximos</label><input id="genMax" type="number" value="1" min="1"></div>
        <div><label>Caduca (opcional)</label><input id="genExp" type="datetime-local"></div>
      </div>
      <label>Nota</label><textarea id="genNote" rows="2"></textarea>
      <div style="margin-top:12px"><button id="btnGen">Generar</button></div>
      <div id="genOut" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h2>Archivo activo (.so o .zip)</h2>
      <div class="row"><div><label>Versión</label><input id="upVersion" placeholder="1.0.0"></div></div>
      <div id="drop" class="drop">Arrastra aquí el .so o .zip, o haz clic para elegir</div>
      <input id="fileInput" type="file" accept=".so,.zip" class="hidden">
      <div style="margin-top:12px"><button id="btnUpload" disabled>Subir</button></div>
      <div id="upLog"></div>
      <table id="buildsTable" style="margin-top:16px"></table>
    </section>

    <section class="card">
      <h2>Códigos</h2>
      <input id="search" placeholder="Filtrar por código, dispositivo, etiqueta, creador o nota…">
      <table id="codesTable" style="margin-top:12px"></table>
    </section>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL      = "https://hxbirrtyrrisblsggjad.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xproLTlb2fz1ecsPb62K0Q_tZ9bM68u";
const BUCKET = "builds";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const log = (el, m) => { el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));

$("btnLogin").onclick = async () => {
  $("log").textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("pass").value
  });
  if (error) return log($("log"), "✗ " + error.message);
  refreshSession();
};

async function refreshSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $("loginView").classList.remove("hidden");
    $("appView").classList.add("hidden");
    $("authBox").innerHTML = "";
    return;
  }
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("authBox").innerHTML =
    `<span style="color:#8b949e">${esc(session.user.email)}</span>
     <button class="ghost" id="btnOut" style="margin-left:10px">Salir</button>`;
  $("btnOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  loadCodes();
  loadBuilds();
}
refreshSession();

/* ── Generar ── */
$("btnGen").onclick = async () => {
  $("genOut").textContent = "";
  const { data, error } = await sb.rpc("create_codes", {
    p_qty: +$("genQty").value || 1,
    p_max_uses: +$("genMax").value || 1,
    p_expires: $("genExp").value ? new Date($("genExp").value).toISOString() : null,
    p_note: $("genNote").value.trim() || null,
    p_device_id: $("genDev").value.trim() || null
  });
  if (error) return alert("Error: " + error.message);

  const label = $("genLabel").value.trim();
  if (label && data?.length) {
    await sb.from("activation_codes").update({ label }).in("id", data.map(d => d.id));
  }
  $("genOut").innerHTML = data.map(d => `<div><code>${esc(d.code)}</code></div>`).join("");
  $("genDev").value = ""; $("genNote").value = ""; $("genLabel").value = "";
  loadCodes();
};

/* ── Listado ── */
let codes = [];
async function loadCodes() {
  const { data, error } = await sb.from("activation_codes")
    .select("*").order("created_at", { ascending: false }).limit(500);
  if (error) return alert(error.message);
  codes = data || [];
  renderCodes();
}

$("search").oninput = renderCodes;

function renderCodes() {
  const q = $("search").value.toLowerCase();
  const rows = codes.filter(c => !q ||
    (c.code       || "").toLowerCase().includes(q) ||
    (c.device_id  || "").toLowerCase().includes(q) ||
    (c.created_by || "").toLowerCase().includes(q) ||
    (c.note       || "").toLowerCase().includes(q) ||
    (c.label      || "").toLowerCase().includes(q));

  $("codesTable").innerHTML = `
    <tr><th>Código</th><th>ID dispositivo</th><th>Etiqueta</th><th>Estado</th>
        <th>Usos</th><th>Caduca</th><th>Último uso</th><th>Creado por</th><th>Nota</th><th></th></tr>` +
    rows.map(c => `
      <tr data-id="${c.id}">
        <td><code>${esc(c.code)}</code><br>
            <button class="ghost" data-act="copy" style="padding:2px 6px;font-size:11px">copiar</button></td>
        <td><input value="${esc(c.device_id)}" data-f="device_id" placeholder="libre" style="min-width:150px"></td>
        <td><input value="${esc(c.label)}" data-f="label"></td>
        <td>${c.device_id
              ? '<span class="pill used">ligado</span>'
              : '<span class="pill unused">libre</span>'}
            ${c.status === "revoked" ? '<span class="pill revoked">revocado</span>' : ""}
            <select data-f="status" style="margin-top:4px;font-size:11px;padding:2px">
              ${["unused","used","revoked"].map(s =>
                `<option ${s===c.status?"selected":""}>${s}</option>`).join("")}
            </select></td>
        <td><input type="number" min="1" value="${c.max_uses}" data-f="max_uses" style="width:70px">
            <span style="color:#8b949e">/${c.uses}</span></td>
        <td><input type="datetime-local" data-f="expires_at"
             value="${c.expires_at ? c.expires_at.slice(0,16) : ""}"></td>
        <td><code>${esc((c.last_used_at || "").slice(0,16).replace("T"," ")) || "—"}</code></td>
        <td><code style="font-size:11px;color:#8b949e">${esc(c.created_by) || "—"}</code></td>
        <td><input value="${esc(c.note)}" data-f="note"></td>
        <td style="white-space:nowrap">
          <button class="ghost" data-act="save">Guardar</button>
          <button class="danger" data-act="del">×</button>
        </td>
      </tr>`).join("");
}

$("codesTable").onclick = async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const tr = btn.closest("tr");
  const id = tr.dataset.id;

  if (btn.dataset.act === "copy") {
    await navigator.clipboard.writeText(tr.querySelector("code").textContent);
    btn.textContent = "✓";
    setTimeout(() => btn.textContent = "copiar", 900);
    return;
  }
  if (btn.dataset.act === "del") {
    if (!confirm("¿Borrar este código?")) return;
    const { error } = await sb.from("activation_codes").delete().eq("id", id);
    if (error) return alert(error.message);
    return loadCodes();
  }

  const patch = {};
  tr.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    if (f === "max_uses") patch[f] = +el.value || 1;
    else if (f === "expires_at") patch[f] = el.value ? new Date(el.value).toISOString() : null;
    else patch[f] = el.value.trim() || null;
  });
  const { error } = await sb.from("activation_codes").update(patch).eq("id", id);
  if (error) return alert(error.message);
  btn.textContent = "✓";
  setTimeout(() => { btn.textContent = "Guardar"; loadCodes(); }, 900);
};

/* ── Builds ── */
let picked = null;
$("drop").onclick = () => $("fileInput").click();
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("hover"); };
$("drop").ondragleave = () => $("drop").classList.remove("hover");
$("drop").ondrop = (e) => {
  e.preventDefault(); $("drop").classList.remove("hover");
  setFile(e.dataTransfer.files[0]);
};
$("fileInput").onchange = (e) => setFile(e.target.files[0]);

function setFile(f) {
  if (!f) return;
  if (!/\.(so|zip)$/i.test(f.name)) return alert("Solo .so o .zip");
  picked = f;
  $("drop").textContent = `${f.name} · ${(f.size/1024).toFixed(1)} KB`;
  $("btnUpload").disabled = false;
}

$("btnUpload").onclick = async () => {
  if (!picked) return;
  const version = $("upVersion").value.trim();
  if (!version) return alert("Indica una versión");

  $("btnUpload").disabled = true;
  $("upLog").textContent = "";

  const buf = await picked.arrayBuffer();
  const digest = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))]
    .map(b => b.toString(16).padStart(2, "0")).join("");
  const path = `${Date.now()}_${picked.name.replace(/[^\w.\-]/g, "_")}`;

  log($("upLog"), "Subiendo…");
  const { error: upErr } = await sb.storage.from(BUCKET)
    .upload(path, picked, { contentType: "application/octet-stream" });
  if (upErr) { log($("upLog"), "✗ " + upErr.message); $("btnUpload").disabled = false; return; }

  const { error: dbErr } = await sb.from("builds").insert({
    version, file_name: picked.name, storage_path: path,
    is_zip: /\.zip$/i.test(picked.name), sha256: digest,
    size_bytes: picked.size, active: false
  });
  if (dbErr) { log($("upLog"), "✗ " + dbErr.message); $("btnUpload").disabled = false; return; }

  log($("upLog"), "✓ Subido");
  picked = null;
  $("fileInput").value = "";
  $("btnUpload").disabled = true;
  $("drop").textContent = "Arrastra aquí el .so o .zip, o haz clic para elegir";
  loadBuilds();
};

async function loadBuilds() {
  const { data } = await sb.from("builds").select("*").order("created_at", { ascending: false });
  $("buildsTable").innerHTML = `
    <tr><th>Versión</th><th>Archivo</th><th>Tipo</th><th>SHA-256</th><th>Activo</th><th></th></tr>` +
    (data || []).map(b => `
      <tr>
        <td>${esc(b.version)}</td><td>${esc(b.file_name)}</td>
        <td>${b.is_zip ? "zip" : "so"}</td>
        <td><code>${esc((b.sha256 || "").slice(0, 12))}…</code></td>
        <td>${b.active ? '<span class="pill used">sí</span>' : "no"}</td>
        <td style="white-space:nowrap">
          ${b.active ? "" : `<button class="ghost" data-act="act" data-id="${b.id}">Activar</button>`}
          <button class="danger" data-act="delb" data-id="${b.id}" data-path="${esc(b.storage_path)}">×</button>
        </td>
      </tr>`).join("");
}

$("buildsTable").onclick = async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.act === "act") {
    await sb.from("builds").update({ active: false }).eq("active", true);
    const { error } = await sb.from("builds").update({ active: true }).eq("id", btn.dataset.id);
    if (error) return alert(error.message);
    return loadBuilds();
  }
  if (!confirm("¿Borrar archivo?")) return;
  await sb.storage.from(BUCKET).remove([btn.dataset.path]);
  await sb.from("builds").delete().eq("id", btn.dataset.id);
  loadBuilds();
};
</script>
</body>
</html>
